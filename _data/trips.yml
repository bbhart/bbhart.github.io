---
# Map data for the /trips/ page. Keyed by the recap post's slug (its filename
# minus the date). `pin` is where the trip's marker sits; `stops` draw the
# route when the trip is selected. Coordinates are [lat, lng].
# A stop is [name, lat, lng], with an optional 4th element for nights slept
# there; omit it for 0.
# `rollup_key` ties the recap to its day posts, and `label` and `year` name the
# trip on home page city cards.
#
# A recap with no entry here still shows in the trip grid, just not on the map.

europe-2007:
  rollup_key: 2007eu
  label: Western Europe cruise
  year: 2007
  pin: [48.857, 2.352]
